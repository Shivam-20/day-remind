name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        env:
          MONGO_INITDB_ROOT_USERNAME: dayremind
          MONGO_INITDB_ROOT_PASSWORD: dayremind
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh -u dayremind -p dayremind --authenticationDatabase admin --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: mongodb://dayremind:dayremind@localhost:27017/day_remind?authSource=admin
      SESSION_KEY: ci-test-session-key-at-least-32-chars-long
    # go.mod replaces telegram-gateway with ../telegram-gateway, so check both
    # repos out side by side. telegram-gateway is private: the default
    # GITHUB_TOKEN can't read it, hence a read-only deploy key on that repo.
    defaults:
      run:
        working-directory: day-remind
    steps:
      - uses: actions/checkout@v4
        with:
          path: day-remind
      - uses: actions/checkout@v4
        with:
          repository: Shivam-20/telegram-gateway
          ssh-key: ${{ secrets.TELEGRAM_GATEWAY_DEPLOY_KEY }}
          path: telegram-gateway
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: day-remind/go.sum
      - run: go mod download
      - run: go test ./...
      - run: go build -o /dev/null ./cmd/server
