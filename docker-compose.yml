services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: dayremind
      MONGO_INITDB_ROOT_PASSWORD: dayremind
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - day_remind_mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "-u", "dayremind", "-p", "dayremind", "--authenticationDatabase", "admin", "--eval", "db.adminCommand({ ping: 1 })"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      # go.mod replaces github.com/shivam-20/telegram-gateway with the local
      # sibling checkout; expose it to the image build as a named context.
      additional_contexts:
        telegram-gateway: ../telegram-gateway
    container_name: day-remind-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # container reaches mongo by service name (overrides localhost .env value)
      DATABASE_URL: mongodb://dayremind:dayremind@mongo:27017/day_remind?authSource=admin
      # Telegram Gateway: when TELEGRAM_GATEWAY_URL is set, day-remind routes all
      # Telegram traffic through the gateway (which holds the bot token).
      # The gateway container must already be running on apps-net
      # (see ../telegram-gateway/docker-compose.yml). Both services resolve each
      # other by Docker DNS name on the shared apps-net network.
      # TELEGRAM_GATEWAY_URL: http://telegram-gateway:8091
      # TELEGRAM_GATEWAY_API_TOKEN: tgw_...
      # TELEGRAM_GATEWAY_INBOUND_MODE: poll
    networks:
      - default
      - apps-net
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  day_remind_mongo:

networks:
  apps-net:
    external: true
