services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dayremind
      POSTGRES_PASSWORD: dayremind
      POSTGRES_DB: day_remind
    ports:
      - "5433:5432"
    volumes:
      - day_remind_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dayremind -d day_remind"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  day_remind_pg:
