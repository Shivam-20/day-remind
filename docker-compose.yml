services:
  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: dayremind
      MONGO_INITDB_ROOT_PASSWORD: dayremind
    ports:
      - "27017:27017"
    volumes:
      - day_remind_mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "-u", "dayremind", "-p", "dayremind", "--authenticationDatabase", "admin", "--eval", "db.adminCommand({ ping: 1 })"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Local SMTP catcher for development: nothing leaves the machine.
  # Web UI on http://localhost:8025, SMTP on :1025.
  # Use SMTP_HOST=localhost SMTP_PORT=1025 SMTP_TLS=none SMTP_FROM=dev@day-remind.local
  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  day_remind_mongo:
